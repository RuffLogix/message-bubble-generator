<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .green { fill:#dcefdf; stroke:#a3cdaa; }
      .blue  { fill:#d8e6f5; stroke:#a2c0dd; }
      .yell  { fill:#fbecd1; stroke:#e2c488; }
      .gray  { fill:#ececec; stroke:#c6c6c6; }
      .sec   { fill:#fbfbfb; stroke:#d6d6d6; }
      .panel { fill:#ffffff; stroke:#cfcfcf; stroke-dasharray:4 3; }
      .ttl   { font-size:13px; font-weight:600; fill:#1d1d1d; }
      .sub   { font-size:10px; fill:#555; }
      .cap   { font-size:10px; font-weight:700; fill:#666; letter-spacing:.06em; }
      .body  { font-size:10.5px; fill:#3d3d3d; }
      .bodyb { font-size:10.5px; font-weight:700; fill:#1d1d1d; }
      .pnl   { font-size:13px; font-weight:700; fill:#1d1d1d; }
      .mono  { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; fill:#2b2b2b; }
      .monob { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:15px; font-weight:700; fill:#1d1d1d; }
      .edge  { fill:none; stroke:#4a4a4a; stroke-width:1.4; }
      .foot  { font-size:10px; font-style:italic; fill:#666; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#ffffff"/>

  <text x="24" y="36" font-size="19" font-weight="700" fill="#1d1d1d">Message Bubble Generator</text>
  <text x="24" y="55" font-size="11" fill="#666">No build step, no dependencies. ES modules feeding one &lt;canvas&gt;.</text>

  <!-- ROW 1 — input -->
  <text class="cap" x="24" y="86">INPUT</text>

  <rect class="gray" x="24" y="96" width="416" height="56" rx="7"/>
  <text class="ttl" x="232" y="120" text-anchor="middle">Script — paste L: / R: lines</text>
  <text class="sub" x="232" y="137" text-anchor="middle">press Play to animate the whole conversation</text>

  <rect class="gray" x="464" y="96" width="416" height="56" rx="7"/>
  <text class="ttl" x="672" y="120" text-anchor="middle">Live — type, press Enter</text>
  <text class="sub" x="672" y="137" text-anchor="middle">the bubble drops onto the stack immediately</text>

  <path class="edge" d="M 232 152 L 232 176" marker-end="url(#arw)"/>
  <path class="edge" d="M 672 152 L 672 176" marker-end="url(#arw)"/>

  <!-- ROW 2 — producers -->
  <text class="cap" x="24" y="196">PRODUCERS · pure, no DOM</text>

  <rect class="green" x="24" y="206" width="416" height="60" rx="7"/>
  <text class="ttl" x="232" y="231" text-anchor="middle">parseMessages() → buildTimeline()</text>
  <text class="sub" x="232" y="248" text-anchor="middle">schedules every message up front: type, hold, gap</text>

  <rect class="green" x="464" y="206" width="416" height="60" rx="7"/>
  <text class="ttl" x="672" y="231" text-anchor="middle">appendLive()</text>
  <text class="sub" x="672" y="248" text-anchor="middle">stamps one message from the session clock</text>

  <path class="edge" d="M 232 266 L 232 288" marker-end="url(#arw)"/>
  <path class="edge" d="M 672 266 L 672 288" marker-end="url(#arw)"/>

  <!-- CONTRACT -->
  <rect class="yell" x="24" y="294" width="856" height="62" rx="8"/>
  <text class="monob" x="452" y="322" text-anchor="middle">{ index, side, text, typeStart, typeEnd }</text>
  <text class="sub" x="452" y="341" text-anchor="middle">One item shape, two producers — the renderer reads nothing else, so it cannot tell the two modes apart</text>

  <path class="edge" d="M 452 356 L 452 384" marker-end="url(#arw)"/>

  <!-- RENDERER -->
  <rect class="sec" x="24" y="390" width="856" height="170" rx="10"/>
  <text class="ttl" x="40" y="414">renderFrame(ctx, items, elapsed, settings)</text>
  <text class="sub" x="40" y="431">A pure function of elapsed time — no timers anywhere. That is why a recording is pixel-identical to the preview.</text>

  <rect class="green" x="40" y="446" width="266" height="98" rx="7"/>
  <text class="ttl" x="173" y="472" text-anchor="middle">measure</text>
  <text class="sub" x="173" y="493" text-anchor="middle">reveal the text so far,</text>
  <text class="sub" x="173" y="508" text-anchor="middle">wrap it, size the bubble —</text>
  <text class="sub" x="173" y="523" text-anchor="middle">by grapheme, so Thai marks</text>
  <text class="sub" x="173" y="538" text-anchor="middle">never split from their base</text>

  <rect class="yell" x="318" y="446" width="266" height="98" rx="7"/>
  <text class="ttl" x="451" y="472" text-anchor="middle">place</text>
  <text class="sub" x="451" y="493" text-anchor="middle">stack downward, pin each</text>
  <text class="sub" x="451" y="508" text-anchor="middle">bubble to its side, then aim</text>
  <text class="sub" x="451" y="523" text-anchor="middle">the camera so the newest</text>
  <text class="sub" x="451" y="538" text-anchor="middle">bubble sits at the bottom</text>

  <rect class="green" x="596" y="446" width="266" height="98" rx="7"/>
  <text class="ttl" x="729" y="472" text-anchor="middle">draw</text>
  <text class="sub" x="729" y="493" text-anchor="middle">body and tail as one path,</text>
  <text class="sub" x="729" y="508" text-anchor="middle">then the text centred in the</text>
  <text class="sub" x="729" y="523" text-anchor="middle">bubble — all in output</text>
  <text class="sub" x="729" y="538" text-anchor="middle">pixels, never CSS pixels</text>

  <path class="edge" d="M 306 495 L 312 495" marker-end="url(#arw)"/>
  <path class="edge" d="M 584 495 L 590 495" marker-end="url(#arw)"/>
  <path class="edge" d="M 452 560 L 452 578" marker-end="url(#arw)"/>

  <!-- CANVAS -->
  <rect class="blue" x="24" y="584" width="856" height="52" rx="8"/>
  <text class="ttl" x="452" y="608" text-anchor="middle">&lt;canvas&gt; — 1080×1920, 1080×1080 or 1920×1080</text>
  <text class="sub" x="452" y="625" text-anchor="middle">No DOM element is ever a bubble. CSS only scales the canvas for display.</text>

  <path class="edge" d="M 232 636 L 232 660" marker-end="url(#arw)"/>
  <path class="edge" d="M 672 636 L 672 660" marker-end="url(#arw)"/>

  <!-- ROW 5 — output -->
  <rect class="gray" x="24" y="666" width="416" height="56" rx="7"/>
  <text class="ttl" x="232" y="690" text-anchor="middle">Preview — one rAF loop</text>
  <text class="sub" x="232" y="707" text-anchor="middle">script and live each have one; only one ever runs</text>

  <rect class="gray" x="464" y="666" width="416" height="56" rx="7"/>
  <text class="ttl" x="672" y="690" text-anchor="middle">Export — WebM</text>
  <text class="sub" x="672" y="707" text-anchor="middle">MediaRecorder over canvas.captureStream(60)</text>

  <!-- SIDE PANEL -->
  <text class="pnl" x="900" y="86">Rules that hold it together</text>
  <rect class="panel" x="900" y="96" width="316" height="322" rx="8"/>

  <text class="bodyb" x="916" y="122">One shape, two producers</text>
  <text class="body" x="916" y="138">Change what one emits and you must</text>
  <text class="body" x="916" y="152">change the other.</text>

  <text class="bodyb" x="916" y="180">No timers in the animation</text>
  <text class="body" x="916" y="196">The renderer answers "what does this</text>
  <text class="body" x="916" y="210">look like at time T", nothing more.</text>

  <text class="bodyb" x="916" y="238">Canvas only, output pixels</text>
  <text class="body" x="916" y="254">Layout never consults the CSS size of</text>
  <text class="body" x="916" y="268">the element.</text>

  <text class="bodyb" x="916" y="296">Grapheme clusters, not code points</text>
  <text class="body" x="916" y="312">Thai vowels and tone marks are separate</text>
  <text class="body" x="916" y="326">code points; slicing would break them.</text>

  <text class="bodyb" x="916" y="354">app.js owns the DOM</text>
  <text class="body" x="916" y="370">Every module below it is pure or</text>
  <text class="body" x="916" y="384">canvas-only, and unit-testable.</text>

  <text class="pnl" x="900" y="452">Run it</text>
  <rect class="panel" x="900" y="462" width="316" height="118" rx="8"/>
  <text class="body" x="916" y="486">ES modules need a server:</text>
  <text class="mono" x="916" y="507">python3 -m http.server 8000</text>
  <text class="mono" x="916" y="526">/index.html</text>
  <text class="mono" x="916" y="545">/tests/tests.html</text>
  <text class="body" x="916" y="566" fill="#b03a2e">Add ?v=… on reload — no cache headers.</text>

  <!-- LEGEND -->
  <rect class="green" x="900" y="604" width="14" height="14" rx="3"/>
  <text class="body" x="922" y="615">pure module</text>

  <rect class="yell" x="900" y="628" width="14" height="14" rx="3"/>
  <text class="body" x="922" y="639">data / layout decision</text>

  <rect class="blue" x="900" y="652" width="14" height="14" rx="3"/>
  <text class="body" x="922" y="663">browser API</text>

  <rect class="gray" x="900" y="676" width="14" height="14" rx="3"/>
  <text class="body" x="922" y="687">boundary — UI or file</text>

  <text class="foot" x="24" y="756">Read top to bottom: input becomes messages, messages become timed items, timed items become pixels. Only the rAF loops at the bottom hold state —</text>
  <text class="foot" x="24" y="772">everything above them is a pure function you can call from a test.</text>
</svg>
